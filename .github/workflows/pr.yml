# Calls the shared workflow in this repo's OWN org `.github` repo, which runs both PR gates — `Build & Test` and
# `Check for changeset` — as jobs of one workflow. The per-repo ci.yml and changeset-check.yml
# this replaces shared a trigger and were both PR gates.
#
# The required status check on `main` is `checks / Build & Test`: GitHub reports a job invoked
# through `workflow_call` as `<caller-job-id> / <job name>`, and the caller job below is `checks`.
# Renaming this job renames the check, and a branch protection still pinning the old name waits
# forever on a check that no longer reports.
name: PR

on:
  pull_request:
    branches:
      - main

jobs:
  checks:
    uses: linked-cm/.github/.github/workflows/pr.yml@v1
    # The changeset reminder posts a PR comment. A reusable workflow only holds what its caller
    # granted it, and the org default is read-only.
    permissions:
      contents: read
      pull-requests: write
    with:
      # This package has a unit suite (`npm test`). Require it so a missing script fails CI.
      require-tests: true
      run-e2e: false
